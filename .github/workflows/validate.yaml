name: Validate CSOC bootstrap

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap
        uses: actions/checkout@v4
        with:
          path: js-poc-csoc-bootstrap
      - name: Check out platform APIs
        uses: actions/checkout@v4
        with:
          repository: jayadeyemi/js-poc-csoc-platform-apis
          path: js-poc-csoc-platform-apis
      - name: Check out fleet
        uses: actions/checkout@v4
        with:
          repository: jayadeyemi/js-poc-csoc-fleet
          path: js-poc-csoc-fleet
      - name: Check out app catalog
        uses: actions/checkout@v4
        with:
          repository: jayadeyemi/js-poc-csoc-app-catalog
          path: js-poc-csoc-app-catalog
      - name: Build pinned management image
        working-directory: js-poc-csoc-bootstrap
        run: bash scripts/container/build.sh
      - name: Run validation in the management image
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace/js-poc-csoc-bootstrap
          jetstream2-mgmt:latest
          bash -lc "git config --global --add safe.directory '*' && bash scripts/validate.sh"
