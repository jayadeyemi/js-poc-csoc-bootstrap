apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kro
  namespace: argocd
  annotations:
    # Install KRO before anything that depends on its CRDs
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: rgds
  source:
    chart: kro
    repoURL: registry.k8s.io/kro/charts
    targetRevision: "0.9.3"
    helm:
      releaseName: kro
      values: |
        rbac:
          mode: aggregation
        deployment:
          # One active leader; extra replicas would be standby with leader election.
          replicaCount: 1
          resources:
            limits: {cpu: 1000m, memory: 1024Mi}
            requests: {cpu: 256m, memory: 128Mi}
        config:
          # Kubernetes client throttling shared by KRO's controllers.
          clientQps: 100
          clientBurst: 150
          # Definition and revision compilation are deliberately serialized.
          resourceGraphDefinitionConcurrentReconciles: 1
          graphRevisionConcurrentReconciles: 1
          # Instance graph workers. This is the first knob to test after baseline.
          dynamicControllerConcurrentReconciles: 1
          dynamicControllerDefaultQueueMaxRetries: 20
          dynamicControllerRateLimiterMinDelay: 200ms
          dynamicControllerRateLimiterMaxDelay: 1000s
          dynamicControllerRateLimiterRateLimit: 10
          dynamicControllerRateLimiterBurstLimit: 100
          instance:
            # Fixed polling delay while downstream resources are settling.
            requeueInterval: 3s
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
