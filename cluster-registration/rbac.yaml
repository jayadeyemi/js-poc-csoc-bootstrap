apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-registration
  namespace: cluster-registration
---
# Read SpokeCluster objects and CAPI kubeconfig secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-registration
rules:
  - apiGroups: [csoc.js2.org]
    resources: [spokeclusters]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
    # Scope limited to spoke namespaces; further restricted by namespace in binding
  - apiGroups: [cluster.x-k8s.io]
    resources: [clusters]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-registration
subjects:
  - kind: ServiceAccount
    name: cluster-registration
    namespace: cluster-registration
roleRef:
  kind: ClusterRole
  name: cluster-registration
  apiGroup: rbac.authorization.k8s.io
---
# Write Argo CD cluster secrets in the argocd namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-registration-argocd
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-registration-argocd
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: cluster-registration
    namespace: cluster-registration
roleRef:
  kind: Role
  name: cluster-registration-argocd
  apiGroup: rbac.authorization.k8s.io
