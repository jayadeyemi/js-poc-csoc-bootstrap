apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-registration
  namespace: cluster-registration
spec:
  # Runs every 2 minutes and refreshes reachability, credentials, and labels.
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cluster-registration
          restartPolicy: OnFailure
          containers:
            - name: register
              image: registry.k8s.io/kubectl:v1.34.10
              command: ["/opt/csoc/bin/register.sh"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: cluster-reachability
                  mountPath: /opt/csoc/bin
                  readOnly: true
          volumes:
            - name: cluster-reachability
              configMap:
                name: cluster-reachability
                defaultMode: 0555
