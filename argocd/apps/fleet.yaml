apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csoc-fleet
  namespace: argocd
  annotations:
    # SpokeCluster CRs require the CRD to exist first (created by KRO after wave -5)
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: csoc-fleet
  source:
    repoURL: https://github.com/jayadeyemi/js-poc-csoc-fleet
    targetRevision: main
    directory:
      recurse: true
      include: "customers/**/*.yaml"
      exclude: "**/applications.yaml"   # app assignments are handled separately
  destination:
    server: https://kubernetes.default.svc
    namespace: spokeclusters
  syncPolicy:
    automated:
      prune: false          # never auto-delete a SpokeCluster — requires deliberate action
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
