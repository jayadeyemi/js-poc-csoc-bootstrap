apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csoc-fleet
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: csoc-fleet
  source:
    repoURL: https://github.com/jayadeyemi/js-poc-csoc-fleet
    targetRevision: main
    path: accounts
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    automated:
      prune: false          # never auto-delete a SpokeCluster — requires deliberate action
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
