apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rgds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: rgds
  source:
    repoURL: https://github.com/jayadeyemi/js-poc-csoc-app-catalog
    targetRevision: environment/dev
    # Dev compiles both v1 samples and v2 hub APIs so dual-run compatibility
    # is continuously exercised without creating fleet instances.
    path: rgds
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
