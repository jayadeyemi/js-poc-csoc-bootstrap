apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csoc-v1-scale-00
  namespace: argocd
  labels:
    csoc.js2.org/benchmark: v1-scale
    csoc.js2.org/benchmark-phase: single
    csoc.js2.org/spoke: scale-00-kubernetes-dev
  annotations:
    # Deliberately manual: the benchmark runner records T0 before requesting sync.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: csoc-fleet
  source:
    repoURL: https://github.com/jayadeyemi/js-poc-csoc-fleet
    targetRevision: environment/staging
    path: accounts/staging/accounts/scale-00/kubernetes/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  revisionHistoryLimit: 3
---
