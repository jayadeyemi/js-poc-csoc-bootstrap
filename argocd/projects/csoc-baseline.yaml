apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: csoc-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: "CSOC catalog apps deployed to registered spoke clusters."
  sourceRepos:
    - https://github.com/jayadeyemi/js-poc-csoc-app-catalog
  destinations:
    # Allow deployment to any registered spoke (server=* with label restriction via AppSet)
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: networking.k8s.io
      kind: NetworkPolicy
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: NetworkPolicy
