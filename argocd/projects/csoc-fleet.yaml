apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: csoc-fleet
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: "Account-scoped KRO identity, configuration, network, cluster, and workload instances."
  sourceRepos:
    - https://github.com/jayadeyemi/js-poc-csoc-fleet
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kro-system
    - server: https://kubernetes.default.svc
      namespace: "spokeclusters-*"
  clusterResourceWhitelist:
    - group: apps.csoc.js2.org
      kind: CSOCHelloApp
    - group: csoc.js2.org
      kind: ImmutableSpokeConfig
    - group: csoc.js2.org
      kind: SpokeIdentity
  namespaceResourceWhitelist:
    - group: csoc.js2.org
      kind: SpokeCluster
    - group: csoc.js2.org
      kind: SpokeEnvironmentConfig
    - group: csoc.js2.org
      kind: AutoAllocatedSpokeNetwork
    - group: csoc.js2.org
      kind: DedicatedSpokeNetwork
    - group: apps.csoc.js2.org
      kind: HelloApp
