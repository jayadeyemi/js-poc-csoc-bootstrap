apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: csoc-fleet
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: "Account-scoped KRO identity, configuration, network, cluster, and workload instances."
  orphanedResources:
    warn: true
  sourceRepos:
    - https://github.com/jayadeyemi/js-poc-csoc-fleet
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kro-system
    - server: https://kubernetes.default.svc
      namespace: "spokeclusters-*"
  clusterResourceWhitelist:
    - group: csoc.js2.org
      kind: ImmutableSpokeConfig
    - group: csoc.js2.org
      kind: SpokeIdentity
  namespaceResourceWhitelist:
    - group: csoc.js2.org
      kind: SpokeCluster
    - group: csoc.js2.org
      kind: SpokeEnvironmentConfig
    - group: csoc.js2.org
      kind: SpokeNetworkImportConfig
    - group: csoc.js2.org
      kind: SpokeSharedNetworkConfig
    - group: csoc.js2.org
      kind: AutoAllocatedSpokeNetwork
    - group: csoc.js2.org
      kind: DedicatedSpokeNetwork
    - group: csoc.js2.org
      kind: ImportedSpokeNetwork
    - group: csoc.js2.org
      kind: IsolatedOpenStackNetwork
    - group: csoc.js2.org
      kind: RoutedSpokeNetwork
    - group: csoc.js2.org
      kind: FullyManagedSpokeNetwork
    - group: csoc.js2.org
      kind: SharedProviderNetwork
    - group: csoc.js2.org
      kind: SpokeServerGroup
    - group: csoc.js2.org
      kind: SpokeKeypair
    - group: csoc.js2.org
      kind: SpokeSecurityGroup
    - group: csoc.js2.org
      kind: SpokeVolume
    - group: apps.csoc.js2.org
      kind: HelloApp
    - group: apps.csoc.js2.org
      kind: SpokeHelloApp
    - group: apps.csoc.js2.org
      kind: SpokeGitOps
    - group: apps.csoc.js2.org
      kind: SpokeArgoCD
    - group: apps.csoc.js2.org
      kind: SpokeArgoApplication
