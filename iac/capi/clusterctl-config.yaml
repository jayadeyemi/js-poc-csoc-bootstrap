# clusterctl configuration for Jetstream2 CSOC
# Place this at ~/.cluster-api/clusterctl.yaml, or set CLUSTERCTL_CONFIG to point here.

# Pin provider versions for reproducible deployments.
providers:
  - name: "openstack"
    url: "https://github.com/kubernetes-sigs/cluster-api-provider-openstack/releases/v0.10.3/infrastructure-components.yaml"
    type: "InfrastructureProvider"

# Feature gates required for full CAPO functionality.
# Passed automatically by install-controllers.sh via EXP_* env vars.
