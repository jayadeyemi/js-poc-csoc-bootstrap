# Argo CD Helm values for single-replica POC install
# Used by scripts/bootstrap/argocd/install.sh
# For production: increase replicas, configure HA redis, enable TLS properly.

global:
  domain: argocd.csoc.local

server:
  replicas: 1
  service:
    type: ClusterIP

repoServer:
  replicas: 1
  extraContainers:
    - name: csoc-sops-helm
      image: ghcr.io/jayadeyemi/csoc-sops-helm-cmp:0.1.0
      imagePullPolicy: IfNotPresent
      command: [/var/run/argocd/argocd-cmp-server]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      volumeMounts:
        - {name: var-files, mountPath: /var/run/argocd}
        - {name: plugins, mountPath: /home/argocd/cmp-server/plugins}
        - {name: csoc-cmp-plugin, mountPath: /home/argocd/cmp-server/config/plugin.yaml, subPath: plugin.yaml, readOnly: true}
        - {name: csoc-cmp-tmp, mountPath: /tmp}
        - {name: csoc-age, mountPath: /home/argocd/.config/sops/age, readOnly: true}
  volumes:
    - name: csoc-cmp-plugin
      configMap: {name: csoc-sops-helm-plugin}
    - name: csoc-cmp-tmp
      emptyDir: {medium: Memory, sizeLimit: 256Mi}
    - name: csoc-age
      secret: {secretName: argocd-cmp-age-dev}

applicationSet:
  replicas: 0

controller:
  replicas: 1

configs:
  params:
    server.insecure: "false"
  cm:
    # Track resources via annotation so Argo doesn't fight with other controllers
    application.resourceTrackingMethod: annotation
    # Health check for KRO ResourceGraphDefinition objects
    resource.customizations.health.kro.run_ResourceGraphDefinition: |
      hs = {}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, cond in ipairs(obj.status.conditions) do
          if cond.type == "Ready" and cond.status == "True" then
            hs.status = "Healthy"
            hs.message = cond.message
            return hs
          end
          if cond.type == "Ready" and cond.status == "False" then
            hs.status = "Degraded"
            hs.message = cond.message
            return hs
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for KRO to compile RGD"
      return hs
    # Health check for CAPI Cluster objects
    resource.customizations.health.cluster.x-k8s.io_Cluster: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.phase == "Provisioned" then
          hs.status = "Healthy"
          hs.message = "Cluster provisioned"
          return hs
        end
        if obj.status.phase == "Failed" then
          hs.status = "Degraded"
          hs.message = "Cluster provisioning failed"
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = obj.status.phase or "Provisioning"
      return hs
    # Health check for CSOC SpokeCluster
    resource.customizations.health.csoc.js2.org_SpokeCluster: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.ready == true then
          hs.status = "Healthy"
          hs.message = "SpokeCluster ready: " .. (obj.status.endpoint or "")
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = obj.status and obj.status.phase or "Pending"
      return hs
    resource.customizations.health.infra.csoc.js2.org_WorkloadCluster: |
      hs = {}
      hs.status = obj.status and obj.status.ready == true and "Healthy" or "Progressing"
      hs.message = obj.status and obj.status.phase or "Waiting for CAPI"
      return hs
    resource.customizations.health.infra.csoc.js2.org_SpokeRegistration: |
      hs = {}
      if obj.status ~= nil and obj.status.registered == true then
        hs.status = "Healthy"
      elseif obj.status ~= nil and obj.status.message == "DeregistrationBlocked" then
        hs.status = "Degraded"
      else
        hs.status = "Progressing"
      end
      hs.message = obj.status and obj.status.message or "Waiting for registration"
      return hs
    resource.customizations.health.services.csoc.js2.org_JupyterHubInstance: |
      hs = {}
      hs.status = obj.status and obj.status.ready == true and "Healthy" or "Progressing"
      hs.message = obj.status and obj.status.health or "Waiting for Argo application"
      return hs

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: csoc-sops-helm-plugin
      namespace: argocd
    data:
      plugin.yaml: |
        apiVersion: argoproj.io/v1alpha1
        kind: ConfigManagementPlugin
        metadata:
          name: csoc-sops-helm
        spec:
          version: v1.0
          discover:
            fileName: .csoc-cmp
          generate:
            command: [/usr/local/bin/csoc-cmp-generate]
          preserveFileMode: false
          provideGitCreds: false
