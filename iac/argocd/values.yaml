# Argo CD Helm values for single-replica POC install
# Used by scripts/bootstrap/argocd/install.sh
# For production: increase replicas, configure HA redis, enable TLS properly.

global:
  domain: argocd.csoc.local

server:
  replicas: 1
  service:
    type: ClusterIP

repoServer:
  replicas: 1
  # Upstream default: no request/limit. Exposed for benchmark tuning.
  resources: {}
  # The CMP sidecar stays disabled until its verified image is published by
  # immutable digest. Controller and RGD sources do not require that plugin.

applicationSet:
  replicas: 0

controller:
  replicas: 1
  # Upstream default: no request/limit. Increase with processor counts.
  resources: {}

configs:
  params:
    server.insecure: "false"
    # Application reconciliation workers.
    controller.status.processors: "20"
    controller.operation.processors: "10"
    # Concurrent kubectl fork/exec operations during sync.
    controller.kubectl.parallelism.limit: "20"
    # Management-cluster Kubernetes API client throttle.
    controller.k8s.client.qps: "50"
    controller.k8s.client.burst: "100"
    # Concurrent manifest generation; the pinned upstream default is one.
    reposerver.parallelism.limit: "1"
  cm:
    # Track resources via annotation so Argo doesn't fight with other controllers
    application.resourceTrackingMethod: annotation
    # Health check for KRO ResourceGraphDefinition objects
    resource.customizations.health.kro.run_ResourceGraphDefinition: |
      hs = {}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, cond in ipairs(obj.status.conditions) do
          if cond.type == "Ready" and cond.status == "True" then
            hs.status = "Healthy"
            hs.message = cond.message
            return hs
          end
          if cond.type == "Ready" and cond.status == "False" then
            hs.status = "Degraded"
            hs.message = cond.message
            return hs
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for KRO to compile RGD"
      return hs
    # Health check for CAPI Cluster objects
    resource.customizations.health.cluster.x-k8s.io_Cluster: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.phase == "Provisioned" then
          hs.status = "Healthy"
          hs.message = "Cluster provisioned"
          return hs
        end
        if obj.status.phase == "Failed" then
          hs.status = "Degraded"
          hs.message = "Cluster provisioning failed"
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = obj.status.phase or "Provisioning"
      return hs
    # Health check for CSOC SpokeCluster
    resource.customizations.health.csoc.js2.org_SpokeCluster: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.ready == true then
          hs.status = "Healthy"
          hs.message = "SpokeCluster ready: " .. (obj.status.endpoint or "")
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = obj.status and obj.status.phase or "Pending"
      return hs
    resource.customizations.health.infra.csoc.js2.org_WorkloadCluster: |
      hs = {}
      hs.status = obj.status and obj.status.ready == true and "Healthy" or "Progressing"
      hs.message = obj.status and obj.status.phase or "Waiting for CAPI"
      return hs
    resource.customizations.health.infra.csoc.js2.org_SpokeRegistration: |
      hs = {}
      if obj.status ~= nil and obj.status.registered == true then
        hs.status = "Healthy"
      elseif obj.status ~= nil and obj.status.message == "DeregistrationBlocked" then
        hs.status = "Degraded"
      else
        hs.status = "Progressing"
      end
      hs.message = obj.status and obj.status.message or "Waiting for registration"
      return hs
    resource.customizations.health.services.csoc.js2.org_JupyterHubInstance: |
      hs = {}
      hs.status = obj.status and obj.status.ready == true and "Healthy" or "Progressing"
      hs.message = obj.status and obj.status.health or "Waiting for Argo application"
      return hs
